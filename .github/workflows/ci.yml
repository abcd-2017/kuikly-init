name: Kuikly CI

# ============================================================
# CI 流水线 — 质量门控（编译检查 + 单元测试）
#
# 功能：push / PR 时自动运行 lint 和 test，编译通过才可 merge
# 状态：配置完整，入口暂时关闭。恢复时取消下方注释即可。
# ============================================================
on: []
# 恢复时取消以下注释：
# on:
#   push:
#     branches: [main, develop, 'feature/**']
#   pull_request:
#     branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: 代码检查 (Lint)
  # ============================================================
  lint:
    name: Code Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Kotlin compile check (commonMain)
        run: ./gradlew :shared:compileKotlinMetadata --no-daemon --stacktrace

  # ============================================================
  # Job 2: 测试
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew :shared:test --no-daemon --stacktrace
