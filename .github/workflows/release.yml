name: Kuikly Release

# ============================================================
# 发布流水线：tag 更新时自动构建多端产物并上传到 GitHub Release
#
# 触发条件：推送 v* 标签（如 v1.0.0、v2.3.1）
# 产物：Android APK / JS Bundle / iOS Framework / OHOS libshared.so
# ============================================================
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: 代码检查 (Lint) — 质量门控
  # ============================================================
  lint:
    name: Code Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Kotlin compile check (commonMain)
        run: ./gradlew :shared:compileKotlinMetadata --no-daemon --stacktrace

  # ============================================================
  # Job 2: 测试 — 质量门控
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew :shared:test --no-daemon --stacktrace

  # ============================================================
  # Job 3: Android Release APK 构建
  # ============================================================
  android:
    name: Android Release Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate CI keystore for release signing
        run: |
          CI_KEYSTORE_PATH="${HOME}/.ci-release-keystore"
          keytool -genkey -v \
            -keystore "${CI_KEYSTORE_PATH}" \
            -alias ci-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"
          echo "CI_KEYSTORE_PATH=${CI_KEYSTORE_PATH}" >> "${GITHUB_ENV}"
          echo "KEYSTORE_PASSWORD=android" >> "${GITHUB_ENV}"
          echo "KEY_ALIAS=ci-release" >> "${GITHUB_ENV}"
          echo "KEY_PASSWORD=android" >> "${GITHUB_ENV}"

      - name: Build shared module (Android)
        run: ./gradlew :shared:compileDebugKotlinAndroid --no-daemon --stacktrace

      - name: Build Android APK (Release)
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 30

  # ============================================================
  # Job 4: JS / Webpack 构建
  # ============================================================
  js:
    name: JS Build (Webpack)
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build JS bundle
        run: ./gradlew :shared:jsBrowserProductionWebpack --no-daemon --stacktrace

      - name: Upload JS bundle
        uses: actions/upload-artifact@v4
        with:
          name: js-bundle
          path: shared/build/outputs/kuikly/js/release/
          retention-days: 30

  # ============================================================
  # Job 5: iOS Framework 构建
  # ============================================================
  ios:
    name: iOS Framework Build
    needs: [lint, test]
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS Framework (arm64)
        run: |
          ./gradlew :shared:syncFramework \
            -Pkotlin.native.cocoapods.platform=IOS \
            -Pkotlin.native.cocoapods.archs=arm64 \
            --no-daemon --stacktrace

      - name: Upload iOS Framework
        uses: actions/upload-artifact@v4
        with:
          name: ios-framework
          path: shared/build/cocoapods/framework/
          retention-days: 30

  # ============================================================
  # Job 6: OHOS (鸿蒙) libshared.so 构建
  # ============================================================
  ohos:
    name: OHOS libshared.so Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build OHOS libshared.so (Release)
        run: ./gradlew :harmonySyncRelease --no-daemon --stacktrace

      - name: Upload libshared.so
        uses: actions/upload-artifact@v4
        with:
          name: ohos-libshared
          path: ohosApp/entry/libs/arm64-v8a/libshared.so
          retention-days: 30

  # ============================================================
  # Job 7: 创建 GitHub Release 并上传产物
  # ============================================================
  release:
    name: Create GitHub Release
    needs: [android, js, ios, ohos]
    runs-on: ubuntu-latest
    # 仅在 tag push 时创建 Release（手动触发 workflow_dispatch 时跳过）
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release-assets/**/*
