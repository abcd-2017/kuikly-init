#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M"
#Kotlin
kotlin.code.style=official
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
ksp.incremental=false
compose.ios.resources.sync=false

# ============================================================
#  包名配置（集中管理，源码中引用而非硬编码）
#  阶段2模板化时替换此值即可: __PACKAGE_NAME__
# ============================================================
package.name=com.kuikly.init

# ============================================================
#  Harmony (OHOS) 平台构建配置
#  通过 -Pharmony.type=release 或修改默认值切换构建类型
# ============================================================
# 鸿蒙构建类型: debug | release
harmony.type=debug
# 鸿蒙构建产物目标平台架构
harmony.arch=arm64-v8a
# 鸿蒙 DevEco Studio SDK 路径（留空则使用脚本默认值）
harmony.sdk.path=E\:\\IDE\\DevEco Studio
# 是否启用持续构建（热重载）: true | false
harmony.continuous=false